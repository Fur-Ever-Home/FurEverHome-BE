name: Java Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build & Test Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Test with Maven or Gradle
        run: |
          if [ -f pom.xml ]; then
            echo "Proiect Maven detectat."
            if [ -f mvnw ]; then chmod +x mvnw && ./mvnw clean package; else mvn clean package; fi
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Proiect Gradle detectat."
            if [ -f gradlew ]; then chmod +x gradlew && ./gradlew build; else gradle build; fi
          else
            echo "Nu a fost găsit încă un proiect Java (lipsesc pom.xml și build.gradle)."
          fi
