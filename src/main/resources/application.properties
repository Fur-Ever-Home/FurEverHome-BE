spring.application.name=proiect_ispgl
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fureverhome}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:db/demo-data.sql

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.notifications.enabled=${MAIL_NOTIFICATIONS_ENABLED:false}
app.mail.contact-to=${CONTACT_NOTIFICATION_TO:${spring.mail.username}}
app.mail.volunteer-to=${VOLUNTEER_NOTIFICATION_TO:${spring.mail.username}}
