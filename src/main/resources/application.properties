spring.application.name=proiect_ispgl
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Configurare trimitere email Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.shelter-approval.recipient=${FUREVERHOME_APPROVAL_RECIPIENT:}
app.shelter-approval.from=${FUREVERHOME_APPROVAL_FROM:${spring.mail.username:}}
app.shelter-approval.base-url=${FUREVERHOME_APPROVAL_BASE_URL:}
app.shelter-approval.signing-key=${FUREVERHOME_APPROVAL_SIGNING_KEY:}

# Comma-separated HTTP(S) origins for the web client.
app.api.allowed-origins=${FUREVERHOME_ALLOWED_ORIGINS:${FUREVERHOME_AUTH_BROWSER_ORIGIN:http://localhost:5173}}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${FUREVERHOME_SESSION_COOKIE_SECURE:false}

app.password-reset.from=${FUREVERHOME_PASSWORD_RESET_FROM:${spring.mail.username:}}
app.password-reset.frontend-url=${FUREVERHOME_PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
# Set a stable random secret with at least 32 bytes of entropy to enable password reset.
app.password-reset.signing-key=${FUREVERHOME_PASSWORD_RESET_SIGNING_KEY:}
app.password-reset.ttl-seconds=${FUREVERHOME_PASSWORD_RESET_TTL_SECONDS:1200}
