# Public origin for the site and for its /api reverse proxy.
app.api.allowed-origins=${FUREVERHOME_ALLOWED_ORIGINS:${FUREVERHOME_PUBLIC_URL}}
app.shelter-approval.base-url=${FUREVERHOME_PUBLIC_URL}
app.password-reset.frontend-url=${FUREVERHOME_PUBLIC_URL}
app.shelter-approval.from=${FUREVERHOME_APPROVAL_FROM:${FUREVERHOME_ACCOUNT_MAIL_FROM:${spring.mail.username:}}}
app.password-reset.from=${FUREVERHOME_PASSWORD_RESET_FROM:${FUREVERHOME_ACCOUNT_MAIL_FROM:${spring.mail.username:}}}
app.account-mail.transport=${FUREVERHOME_ACCOUNT_MAIL_TRANSPORT:smtp}
app.account-mail.brevo-api-key=${FUREVERHOME_BREVO_API_KEY:}

server.servlet.session.cookie.secure=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
